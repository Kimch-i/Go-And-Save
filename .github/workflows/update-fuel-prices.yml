name: Update fuel prices

# Runs itself on a schedule. Reads this week's gasoline and diesel price from a
# public source (see SOURCES in scripts/update-fuel-prices.mjs), sanity-checks
# them, and if they changed:
#   1. commits the new rows to seed.sql / seed.json on main,
#   2. upserts every fuel price into the live database (Neon),
#   3. redeploys the GitHub Pages client.
# No pull request, no npm command, nothing to do by hand.
#
# ONE-TIME SETUP, in the browser:
#   Settings > Secrets and variables > Actions > Secrets > New repository secret
#     Name:  DATABASE_URL
#     Value: the same Neon connection string Render uses
# Without it, steps 1 and 3 still run and the database step is skipped with a
# warning.
#
# If no source can be parsed, the run fails loudly (GitHub emails you) and
# nothing is written -- a stale price is better than a wrong one.

on:
  schedule:
    # Every day at 01:00 UTC (09:00 Manila). Adjustments take effect on
    # Tuesdays, sometimes mid-week during a crisis, and sources publish at
    # different times; a run that finds the same prices changes nothing.
    - cron: '0 1 * * *'
  workflow_dispatch: {} # "Run workflow" button in the Actions tab, to update right now

permissions:
  contents: write # push the updated seed files to main
  actions: write # start the Pages deploy (pushes made with GITHUB_TOKEN don't trigger it)

concurrency:
  group: fuel-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate this week's prices
        id: prices
        run: node scripts/update-fuel-prices.mjs

      - name: Commit the new prices to main
        if: steps.prices.outputs.changed == 'true'
        run: |
          git config user.name "Kimch-i"
          git config user.email "180493315+Kimch-i@users.noreply.github.com"
          git add server/db/seed.sql client/src/api/seed.json
          git commit -m "chore: fuel prices for week of ${{ steps.prices.outputs.week_of }}" \
            -m "Gasoline ₱${{ steps.prices.outputs.gasoline }}/L, diesel ₱${{ steps.prices.outputs.diesel }}/L. Source: ${{ steps.prices.outputs.source }}"
          git pull --rebase origin main
          git push origin HEAD:main

      # Runs on every check, not only when something changed, so a week a past
      # run failed to push catches up. It is an upsert of fuel_prices only.
      - name: Sync prices to the live database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set, so the live database was not updated. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          git pull --ff-only origin main
          node scripts/update-fuel-prices.mjs --sql > "$RUNNER_TEMP/fuel-prices.sql"
          cd server
          npm ci --omit=dev
          node db/run.js "$RUNNER_TEMP/fuel-prices.sql"

      - name: Redeploy the site
        if: steps.prices.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Summary
        run: |
          {
            echo "### Fuel prices"
            echo "- Gasoline: ₱${{ steps.prices.outputs.gasoline }}/L"
            echo "- Diesel: ₱${{ steps.prices.outputs.diesel }}/L"
            echo "- As of: ${{ steps.prices.outputs.week_of }}"
            echo "- Source: ${{ steps.prices.outputs.source }}"
            echo "- Changed: ${{ steps.prices.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
